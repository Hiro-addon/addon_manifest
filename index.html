<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiro Addon Tools</title>
<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:24px 16px 50px;
}

h1{
  margin:0;
  font-size:28px;
}

.subtitle{
  margin:6px 0 28px;
  color:#888;
}

.section{
  background:#1a1a1a;
  border:1px solid #292929;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
}

.section h2{
  margin:0 0 16px;
  font-size:18px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#bbb;
  font-size:14px;
}

input{
  width:100%;
  padding:12px 14px;
  border-radius:9px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#666;
}

input::placeholder{
  color:#777;
  opacity:.55;
}

.field{
  margin-bottom:15px;
}

.field:last-child{
  margin-bottom:0;
}

.choice{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.choice button,
.script-choice button{
  padding:13px 10px;
  border:1px solid #333;
  border-radius:10px;
  background:#111;
  color:#aaa;
  cursor:pointer;
  font-size:14px;
}

.choice button.active,
.script-choice button.active{
  background:#fff;
  color:#111;
  border-color:#fff;
}

.script-choice{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:16px;
}

.generate{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:16px;
}

.result-box{
  background:#0d0d0d;
  border:1px solid #292929;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:16px;
}

.result-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  border-bottom:1px solid #292929;
  font-weight:bold;
}

.copy-btn{
  padding:7px 12px;
  border:1px solid #444;
  border-radius:7px;
  background:#1a1a1a;
  color:#fff;
  cursor:pointer;
  font-size:12px;
}

.copy-btn:hover{
  background:#252525;
}

pre{
  margin:0;
  padding:15px;
  overflow-x:auto;
  white-space:pre-wrap;
  word-break:break-word;
  color:#ddd;
  font-size:13px;
  line-height:1.6;
}

.hidden{
  display:none;
}

@media(max-width:650px){
  .choice{
    grid-template-columns:1fr;
  }

  .script-choice{
    grid-template-columns:1fr;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>
<body>

<div class="container">

  <h1>Hiro Addon Tools</h1>
  <div class="subtitle">Minecraft Bedrock Addon Manifest Generator</div>

  <div class="section">
    <h2>パックタイプ</h2>

    <div class="choice">
      <button id="bpBtn" class="active">ビヘイビアパック</button>
      <button id="rpBtn">リソースパック</button>
      <button id="bothBtn">BP ＋ RP</button>
    </div>
  </div>

  <div class="section">
    <h2>基本設定</h2>

    <div class="field">
      <label>アドオン名</label>
      <input id="name" type="text" placeholder="アドオン名">
    </div>

    <div class="field">
      <label>説明文</label>
      <input id="description" type="text" placeholder="アドオン説明文">
    </div>

    <div class="field">
      <label>アドオンのバージョン</label>
      <input id="version" type="text" placeholder="1.0.0">
    </div>

    <div class="field">
      <label>最低Minecraftバージョン</label>
      <input id="engine" type="text" placeholder="1.20.0">
    </div>
  </div>

  <div class="section" id="scriptSection">
    <h2>スクリプト</h2>

    <div class="script-choice">
      <button id="scriptOffBtn" class="active">使用しない</button>
      <button id="scriptOnBtn">使用する</button>
    </div>

    <div id="scriptSettings" class="hidden">

      <div class="field">
        <label>エントリーファイル</label>
        <input id="entry" type="text" placeholder="空欄なら main.js">
      </div>

      <div class="field">
        <label>@minecraft/server バージョン</label>
        <input id="serverVersion" type="text" placeholder="1.15.0">
      </div>

      <div class="field">
        <label>@minecraft/server-ui</label>
        <div style="display:flex;align-items:center;gap:10px;">
          <input id="uiCheck" type="checkbox" style="width:18px;height:18px;">
          <span style="color:#aaa;font-size:14px;">使用する</span>
        </div>
      </div>

      <div class="field hidden" id="uiVersionField">
        <label>@minecraft/server-ui バージョン</label>
        <input id="uiVersion" type="text" placeholder="1.1.0">
      </div>

    </div>
  </div>

  <div class="section">
    <button class="generate" id="generate">Manifestを生成</button>
  </div>

  <div class="result" id="result"></div>

</div>

<script>
let packType="bp";
let useScript=false;

const bpBtn=document.getElementById("bpBtn");
const rpBtn=document.getElementById("rpBtn");
const bothBtn=document.getElementById("bothBtn");

const scriptSection=document.getElementById("scriptSection");
const scriptOffBtn=document.getElementById("scriptOffBtn");
const scriptOnBtn=document.getElementById("scriptOnBtn");
const scriptSettings=document.getElementById("scriptSettings");

const uiCheck=document.getElementById("uiCheck");
const uiVersionField=document.getElementById("uiVersionField");

function setPackType(type){
  packType=type;

  bpBtn.classList.toggle("active",type==="bp");
  rpBtn.classList.toggle("active",type==="rp");
  bothBtn.classList.toggle("active",type==="both");

  if(type==="rp"){
    scriptSection.classList.add("hidden");
    useScript=false;
    scriptOffBtn.classList.add("active");
    scriptOnBtn.classList.remove("active");
    scriptSettings.classList.add("hidden");
  }else{
    scriptSection.classList.remove("hidden");
  }
}

bpBtn.onclick=()=>setPackType("bp");
rpBtn.onclick=()=>setPackType("rp");
bothBtn.onclick=()=>setPackType("both");

scriptOffBtn.onclick=()=>{
  useScript=false;
  scriptOffBtn.classList.add("active");
  scriptOnBtn.classList.remove("active");
  scriptSettings.classList.add("hidden");
};

scriptOnBtn.onclick=()=>{
  useScript=true;
  scriptOffBtn.classList.remove("active");
  scriptOnBtn.classList.add("active");
  scriptSettings.classList.remove("hidden");
};

uiCheck.onchange=()=>{
  uiVersionField.classList.toggle("hidden",!uiCheck.checked);
};

function getValue(id,defaultValue){
  const value=document.getElementById(id).value.trim();
  return value||defaultValue;
}

function versionArray(value){
  return value.split(".").map(v=>{
    const n=parseInt(v,10);
    return Number.isNaN(n)?0:n;
  });
}

function getEntry(){
  let entry=document.getElementById("entry").value.trim();

  if(!entry){
    return "main.js";
  }

  if(!entry.endsWith(".js")){
    entry+=".js";
  }

  return entry;
}

function uuid(){
  return crypto.randomUUID();
}

function createBehaviorManifest(name,description,version,engine,bpUuid,rpUuid){
  const bpModuleUuid=uuid();

  const manifest={
    format_version:2,
    header:{
      name:name,
      description:description,
      uuid:bpUuid,
      version:versionArray(version),
      min_engine_version:versionArray(engine)
    },
    modules:[
      {
        description:description,
        type:"data",
        uuid:bpModuleUuid,
        version:versionArray(version)
      }
    ]
  };

  if(useScript){
    const scriptUuid=uuid();

    manifest.modules.push({
      description:"Script",
      type:"script",
      language:"javascript",
      uuid:scriptUuid,
      version:versionArray(version),
      entry:getEntry()
    });

    manifest.dependencies=[
      {
        module_name:"@minecraft/server",
        version:getServerVersion()
      }
    ];

    if(uiCheck.checked){
      manifest.dependencies.push({
        module_name:"@minecraft/server-ui",
        version:getUiVersion()
      });
    }
  }

  if(rpUuid){
    if(!manifest.dependencies){
      manifest.dependencies=[];
    }

    manifest.dependencies.unshift({
      uuid:rpUuid,
      version:versionArray(version)
    });
  }

  return manifest;
}

function createResourceManifest(name,description,version,engine,rpUuid,bpUuid){
  const rpModuleUuid=uuid();

  const manifest={
    format_version:2,
    header:{
      name:name,
      description:description,
      uuid:rpUuid,
      version:versionArray(version),
      min_engine_version:versionArray(engine)
    },
    modules:[
      {
        description:"Resources",
        type:"resources",
        uuid:rpModuleUuid,
        version:versionArray(version)
      }
    ]
  };

  if(bpUuid){
    manifest.dependencies=[
      {
        uuid:bpUuid,
        version:versionArray(version)
      }
    ];
  }

  return manifest;
}

function getServerVersion(){
  const value=document.getElementById("serverVersion").value.trim();
  return versionArray(value||"1.15.0");
}

function getUiVersion(){
  const value=document.getElementById("uiVersion").value.trim();
  return versionArray(value||"1.1.0");
}

function createResult(title,data){
  const box=document.createElement("div");
  box.className="result-box";

  const titleBar=document.createElement("div");
  titleBar.className="result-title";

  const titleText=document.createElement("span");
  titleText.textContent=title;

  const copy=document.createElement("button");
  copy.className="copy-btn";
  copy.textContent="コピー";

  const pre=document.createElement("pre");
  const text=JSON.stringify(data,null,2);
  pre.textContent=text;

  copy.onclick=async()=>{
    await navigator.clipboard.writeText(text);
    copy.textContent="コピーしました";

    setTimeout(()=>{
      copy.textContent="コピー";
    },1500);
  };

  titleBar.appendChild(titleText);
  titleBar.appendChild(copy);

  box.appendChild(titleBar);
  box.appendChild(pre);

  return box;
}

document.getElementById("generate").onclick=()=>{
  const name=getValue("name","アドオン名");
  const description=getValue("description","アドオン説明文");
  const version=getValue("version","1.0.0");
  const engine=getValue("engine","1.20.0");

  const result=document.getElementById("result");
  result.innerHTML="";

  if(packType==="bp"){
    const bpUuid=uuid();

    const bp=createBehaviorManifest(
      name,
      description,
      version,
      engine,
      bpUuid,
      null
    );

    result.appendChild(
      createResult("ビヘイビアパック",bp)
    );
  }

  if(packType==="rp"){
    const rpUuid=uuid();

    const rp=createResourceManifest(
      name,
      description,
      version,
      engine,
      rpUuid,
      null
    );

    result.appendChild(
      createResult("リソースパック",rp)
    );
  }

  if(packType==="both"){
    const bpUuid=uuid();
    const rpUuid=uuid();

    const bp=createBehaviorManifest(
      name,
      description,
      version,
      engine,
      bpUuid,
      rpUuid
    );

    const rp=createResourceManifest(
      name,
      description,
      version,
      engine,
      rpUuid,
      bpUuid
    );

    result.appendChild(
      createResult("ビヘイビアパック",bp)
    );

    result.appendChild(
      createResult("リソースパック",rp)
    );
  }
};
</script>

</body>
</html>
