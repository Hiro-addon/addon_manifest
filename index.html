<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hiro Addon Tools</title>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#101114;
color:#f4f4f5;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.container{
max-width:900px;
margin:auto;
padding:20px
}

header{
margin-bottom:20px
}

h1{
margin:0 0 6px;
font-size:28px
}

.subtitle{
color:#9ca3af
}

.card{
background:#191b20;
border:1px solid #2a2d34;
border-radius:16px;
padding:18px;
margin-bottom:16px
}

h2{
font-size:18px;
margin:0 0 15px
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px
}

label{
display:block;
color:#c9cbd1;
font-size:14px;
margin-bottom:6px
}

input{
width:100%;
border:1px solid #353942;
background:#101216;
color:#fff;
border-radius:10px;
padding:11px;
font-size:15px;
outline:none
}

input:focus{
border-color:#7180ff
}

.choice{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.script-choice{
grid-template-columns:repeat(2,1fr)
}

.choice input{
display:none
}

.choice label{
margin:0;
border:1px solid #353942;
border-radius:11px;
padding:12px;
text-align:center;
cursor:pointer;
background:#111318
}

.choice input:checked+label{
border-color:#7180ff;
background:#222743;
color:#fff
}

.check{
display:flex;
align-items:center;
gap:10px;
margin:12px 0;
color:#ddd;
cursor:pointer
}

.check input{
width:18px;
height:18px
}

.hidden{
display:none
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap
}

button{
border:0;
border-radius:10px;
padding:12px 17px;
font-weight:700;
cursor:pointer;
background:#6573ff;
color:white
}

button.secondary{
background:#2b2e36
}

button:active{
transform:scale(.98)
}

pre{
margin:0;
background:#0b0c0f;
border:1px solid #292c33;
border-radius:12px;
padding:15px;
overflow:auto;
white-space:pre-wrap;
word-break:break-word;
font-size:13px;
line-height:1.55
}

.manifest-title{
font-size:14px;
font-weight:700;
margin:18px 0 8px
}

.manifest-title:first-child{
margin-top:0
}

@media(max-width:650px){

.grid{
grid-template-columns:1fr
}

.choice{
grid-template-columns:1fr
}

.script-choice{
grid-template-columns:1fr
}

.container{
padding:14px
}

h1{
font-size:24px
}

}
</style>
</head>

<body>

<div class="container">

<header>
<h1>Hiro Addon Tools</h1>
<div class="subtitle">Minecraft Bedrock Addon Manifest Generator</div>
</header>

<section class="card">

<h2>パック構成</h2>

<div class="choice">

<input
type="radio"
id="bpOnly"
name="packType"
value="bp"
checked
>

<label for="bpOnly">
ビヘイビアパック
</label>

<input
type="radio"
id="rpOnly"
name="packType"
value="rp"
>

<label for="rpOnly">
リソースパック
</label>

<input
type="radio"
id="both"
name="packType"
value="both"
>

<label for="both">
BP ＋ RP
</label>

</div>

</section>

<section class="card">

<h2>基本設定</h2>

<div class="grid">

<div>

<label for="name">
アドオン名
</label>

<input
id="name"
value="テスト"
>

</div>

<div>

<label for="description">
説明
</label>

<input
id="description"
value="テスト"
>

</div>

<div>

<label for="version">
バージョン
</label>

<input
id="version"
value="1.0.0"
>

</div>

<div>

<label for="engine">
最低Minecraftバージョン
</label>

<input
id="engine"
value="1.20.0"
>

</div>

</div>

</section>

<section
class="card"
id="scriptCard"
>

<h2>スクリプト</h2>

<div class="choice script-choice">

<input
type="radio"
id="scriptNo"
name="script"
value="no"
checked
>

<label for="scriptNo">
使用しない
</label>

<input
type="radio"
id="scriptYes"
name="script"
value="yes"
>

<label for="scriptYes">
使用する
</label>

</div>

<div
id="scriptSettings"
class="hidden"
>

<br>

<div class="grid">

<div>

<label for="serverVersion">
@minecraft/server
</label>

<input
id="serverVersion"
value="1.15.0"
>

</div>

<div>

<label for="entry">
エントリーファイル
</label>

<input
id="entry"
value="scripts/main.js"
>

</div>

</div>

<label class="check">

<input
type="checkbox"
id="serverUi"
>

<span>
@minecraft/server-ui を使用する
</span>

</label>

<div
id="uiVersionBox"
class="hidden"
>

<label for="uiVersion">
@minecraft/server-ui バージョン
</label>

<input
id="uiVersion"
value="1.1.0"
>

</div>

</div>

</section>

<section class="card">

<h2>生成</h2>

<div class="buttons">

<button onclick="generate()">
Manifest生成
</button>

<button
class="secondary"
onclick="copyJSON()"
>
コピー
</button>

<button
class="secondary"
onclick="downloadJSON()"
>
JSONダウンロード
</button>

</div>

</section>

<section class="card">

<h2>プレビュー</h2>

<div id="output">
ここに生成されたManifestが表示されます。
</div>

</section>

</div>

<script>

let generatedData=null;

function uuid(){

return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
/[xy]/g,
function(c){

const r=Math.random()*16|0;

const v=c==="x"
?r
:(r&0x3|0x8);

return v.toString(16);

}
);

}

function versionArray(value){

return value
.split(".")
.map(v=>parseInt(v)||0);

}

function updateScriptVisibility(){

const packType=
document.querySelector(
'input[name="packType"]:checked'
).value;

const scriptCard=
document.getElementById("scriptCard");

if(packType==="rp"){

scriptCard.classList.add("hidden");

}else{

scriptCard.classList.remove("hidden");

}

}

function generate(){

const packType=
document.querySelector(
'input[name="packType"]:checked'
).value;

const useScript=
document.querySelector(
'input[name="script"]:checked'
).value==="yes";

const name=
document.getElementById("name").value;

const description=
document.getElementById("description").value;

const version=
versionArray(
document.getElementById("version").value
);

const engine=
versionArray(
document.getElementById("engine").value
);

const bpUUID=uuid();

const bpModuleUUID=uuid();

const rpUUID=uuid();

const rpModuleUUID=uuid();

const serverVersion=
document.getElementById("serverVersion").value;

const serverUI=
document.getElementById("serverUi").checked;

const uiVersion=
document.getElementById("uiVersion").value;

const entry=
document.getElementById("entry").value;

const result={};

if(
packType==="bp" ||
packType==="both"
){

const bpModules=[
{
"description":description,
"type":"data",
"uuid":bpModuleUUID,
"version":[...version]
}
];

const bpDependencies=[];

if(useScript){

bpModules.push({

"description":"Script",

"type":"script",

"language":"javascript",

"uuid":uuid(),

"version":[...version],

"entry":entry

});

bpDependencies.push({

"module_name":"@minecraft/server",

"version":serverVersion

});

if(serverUI){

bpDependencies.push({

"module_name":"@minecraft/server-ui",

"version":uiVersion

});

}

}

if(packType==="both"){

bpDependencies.push({

"uuid":rpUUID,

"version":[...version]

});

}

const bpManifest={

"format_version":2,

"header":{

"name":name,

"description":description,

"uuid":bpUUID,

"version":[...version],

"min_engine_version":[...engine]

},

"modules":bpModules

};

if(bpDependencies.length>0){

bpManifest.dependencies=
bpDependencies;

}

result.behavior_pack=
bpManifest;

}

if(
packType==="rp" ||
packType==="both"
){

const rpModules=[

{

"description":"Resources",

"type":"resources",

"uuid":rpModuleUUID,

"version":[...version]

}

];

const rpDependencies=[];

if(packType==="both"){

rpDependencies.push({

"uuid":bpUUID,

"version":[...version]

});

}

const rpManifest={

"format_version":2,

"header":{

"name":name,

"description":description,

"uuid":rpUUID,

"version":[...version],

"min_engine_version":[...engine]

},

"modules":rpModules

};

if(rpDependencies.length>0){

rpManifest.dependencies=
rpDependencies;

}

result.resource_pack=
rpManifest;

}

generatedData=result;

renderOutput();

}

function renderOutput(){

const output=
document.getElementById("output");

output.innerHTML="";

if(generatedData.behavior_pack){

const title=
document.createElement("div");

title.className="manifest-title";

title.textContent=
"ビヘイビアパック manifest.json";

output.appendChild(title);

const pre=
document.createElement("pre");

pre.textContent=
JSON.stringify(
generatedData.behavior_pack,
null,
2
);

output.appendChild(pre);

}

if(generatedData.resource_pack){

const title=
document.createElement("div");

title.className="manifest-title";

title.textContent=
"リソースパック manifest.json";

output.appendChild(title);

const pre=
document.createElement("pre");

pre.textContent=
JSON.stringify(
generatedData.resource_pack,
null,
2
);

output.appendChild(pre);

}

}

function copyJSON(){

if(!generatedData){

generate();

}

let text="";

if(generatedData.behavior_pack){

text+=
JSON.stringify(
generatedData.behavior_pack,
null,
2
);

}

if(generatedData.resource_pack){

if(text){

text+="\n\n";

}

text+=
JSON.stringify(
generatedData.resource_pack,
null,
2
);

}

navigator.clipboard.writeText(text);

}

function downloadJSON(){

if(!generatedData){

generate();

}

if(generatedData.behavior_pack){

downloadFile(
"manifest_bp.json",
JSON.stringify(
generatedData.behavior_pack,
null,
2
)
);

}

if(generatedData.resource_pack){

setTimeout(()=>{

downloadFile(
"manifest_rp.json",
JSON.stringify(
generatedData.resource_pack,
null,
2
)
);

},200);

}

}

function downloadFile(filename,text){

const blob=
new Blob(
[text],
{
type:"application/json"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=filename;

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

}

document
.querySelectorAll(
'input[name="packType"]'
)
.forEach(el=>{

el.addEventListener(
"change",
()=>{

updateScriptVisibility();

}
);

});

document
.querySelectorAll(
'input[name="script"]'
)
.forEach(el=>{

el.addEventListener(
"change",
()=>{

document
.getElementById("scriptSettings")
.classList.toggle(
"hidden",
el.value!=="yes"
);

}
);

});

document
.getElementById("serverUi")
.addEventListener(
"change",
function(){

document
.getElementById("uiVersionBox")
.classList.toggle(
"hidden",
!this.checked
);

}
);

updateScriptVisibility();

</script>

</body>
</html>
